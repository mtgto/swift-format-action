name: swift-format
description: 'Lint and format by https://github.com/apple/swift-format'
inputs:
  configuration_file:
    required: false
    default: ''
  all_files:
    required: false
    default: 'false'
  auto_correct:
    required: false
    default: 'false'
  max_warnings:
    required: false
    default: -1

runs:
  using: docker
  image: 'docker://ghcr.io/mtgto/swift-format-action:v1.1.1@sha256:e77bf51cdcf21d976e70bc6ab80da89e464e25fff1c29c54710a2b7c5812c3d2'
