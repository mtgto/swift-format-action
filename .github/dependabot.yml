version: 2
updates:
  # Dependabot also regenerates .github/workflows/actions.lock in the same PR
  # https://docs.github.com/en/actions/how-tos/secure-your-work/lock-workflow-dependencies
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/docker-build-push
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
  # Updates both the tag and the digest of FROM in Dockerfile
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
